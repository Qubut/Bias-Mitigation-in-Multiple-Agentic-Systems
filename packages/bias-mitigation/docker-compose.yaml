x-common-sglang: &common-sglang
  image: docker.io/lmsysorg/sglang:latest
  ipc: host
  cap_add:
    - IPC_LOCK
  ulimits:
    memlock: -1
    stack: 67108864
  restart: unless-stopped
  security_opt:
    - label=disable
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:30000/v1/models"]
    interval: 15s
    timeout: 10s
    retries: 10
    start_period: 300s
  env_file:
    - .env
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
  environment:
    - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-0}
    - HF_TOKEN=${HF_TOKEN}
    - SGLANG_ENABLE_METRICS=true
    - SGLANG_DYNAMIC_CHUNKING_SMOOTH_FACTOR=0.9
    - HF_HUB_ENABLE_HF_TRANSFER=1
    - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  # devices:
  #   - "nvidia.com/gpu=all"

services:

  sglang-llama:
    <<: *common-sglang
    container_name: sglang-llama
    profiles: ["llama"]
    shm_size: '4gb'
    devices:
      - nvidia.com/gpu=0
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
    ports:
      - "30001:30000"
    volumes:
      - hf-cache:/root/.cache/huggingface
      - ./logs/llama:/app/logs
    command: >
      python3 -m sglang.launch_server
        --model-path meta-llama/Llama-3.1-8B-Instruct
        --host 0.0.0.0
        --port 30000
        --tensor-parallel-size 1
        --mem-fraction-static 0.9
        --kv-cache-dtype fp8_e4m3
        --attention-backend flashinfer
        --prefill-attention-backend flashinfer
        --decode-attention-backend flashinfer
        --disable-hybrid-swa-memory
        --trust-remote-code
        --log-level info
        --max-running-requests 64
        --max-queued-requests 512
        --context-length 16384
        --chunked-prefill-size 8192
        --max-prefill-tokens 16384
        --max-total-tokens 65536
        --prefill-max-requests 32
        --enable-dynamic-chunking
        --enable-mixed-chunk
        --enable-single-batch-overlap
        --schedule-policy lpm
        --schedule-conservativeness 0.7
        --cuda-graph-max-bs 64
        --warmups 5
        --enable-metrics
        --enable-metrics-for-all-schedulers
        --radix-eviction-policy lru

  sglang-deepseek:
    <<: *common-sglang
    container_name: sglang-deepseek
    profiles: ["deepseek"]
    shm_size: '4gb'
    devices:
      - nvidia.com/gpu=1
    environment:
      - NVIDIA_VISIBLE_DEVICES=1
    ports:
      - "30002:30000"
    volumes:
      - hf-cache:/root/.cache/huggingface
      - ./logs/deepseek:/app/logs
    command: >
      python3 -m sglang.launch_server
      --model-path deepseek-ai/DeepSeek-R1-Distill-Llama-8B
      --host 0.0.0.0
      --port 30000
      --tensor-parallel-size 1
      --mem-fraction-static 0.9
      --kv-cache-dtype fp8_e4m3
      --attention-backend flashinfer
      --prefill-attention-backend flashinfer
      --decode-attention-backend flashinfer
      --disable-hybrid-swa-memory
      --trust-remote-code
      --log-level info
      --max-running-requests 64
      --max-queued-requests 512
      --context-length 16384
      --chunked-prefill-size 8192
      --max-prefill-tokens 16384
      --max-total-tokens 65536
      --prefill-max-requests 32
      --enable-dynamic-chunking
      --enable-mixed-chunk
      --enable-single-batch-overlap
      --schedule-policy lpm
      --schedule-conservativeness 0.7
      --cuda-graph-max-bs 64
      --warmups 5
      --enable-metrics
      --enable-metrics-for-all-schedulers
      --radix-eviction-policy lru
  sglang-gemma:
    <<: *common-sglang
    container_name: sglang-gemma
    profiles: ["gemma"]
    shm_size: '4gb'
    devices:
      - nvidia.com/gpu=0
      - nvidia.com/gpu=1
    environment:
      - NVIDIA_VISIBLE_DEVICES=0,1
    ports:
      - "30001:30000"
    volumes:
      - hf-cache:/root/.cache/huggingface
      - ./logs/gemma:/app/logs
    command:
      - python3
      - -m
      - sglang.launch_server
      - --model-path
      - google/gemma-3-12b-it
      - --host
      - 0.0.0.0
      - --port
      - "30000"
      - --tensor-parallel-size
      - "2"
      - --data-parallel-size
      - "1"
      - --mem-fraction-static
      - "0.82"
      - --kv-cache-dtype
      - fp8_e4m3
      - --attention-backend
      - flashinfer
      - --prefill-attention-backend
      - flashinfer
      - --decode-attention-backend
      - flashinfer
      - --disable-hybrid-swa-memory
      - --trust-remote-code
      - --log-level
      - info
      - --max-running-requests
      - "128"
      - --max-queued-requests
      - "256"
      - --context-length
      - "16384"
      - --chunked-prefill-size
      - "4096"
      - --max-prefill-tokens
      - "8192"
      - --max-total-tokens
      - "16384"
      - --prefill-max-requests
      - "16"
      - --enable-dynamic-chunking
      - --enable-mixed-chunk
      - --enable-single-batch-overlap
      - --schedule-policy
      - lpm
      - --schedule-conservativeness
      - "0.9"
      - --page-size
      - "64"
      - --enable-torch-compile
      - --torch-compile-max-bs
      - "256"
      - --cuda-graph-max-bs
      - "512"
      - --warmups
      - "5"
      - --enable-metrics
      - --enable-metrics-for-all-schedulers
      - --radix-eviction-policy
      - lru

  sglang-glm:  # ← NEW SERVICE
    <<: *common-sglang
    container_name: sglang-glm
    profiles: ["glm"]
    shm_size: '4gb'  # ← Critical for NCCL data-parallel
    devices:
      - nvidia.com/gpu=2  # ← Adjust: use 5,6 for DP or just 5 for single-GPU
      - nvidia.com/gpu=3
    environment:
      - NVIDIA_VISIBLE_DEVICES=5,6
      - HF_TOKEN=${HF_TOKEN}
      - HF_HUB_ENABLE_HF_TRANSFER=1
    ports:
      - "30005:30000"  # ← Dedicated port for GLM
    volumes:
      - hf-cache:/root/.cache/huggingface
      - ./logs/glm:/app/logs
    command: >
      python3 -m sglang.launch_server
      --model-path THUDM/glm-4-9b-chat
      --host 0.0.0.0
      --port 30000
      --tensor-parallel-size 2
      --mem-fraction-static 0.85
      --kv-cache-dtype fp8_e4m3
      --attention-backend flashinfer
      --prefill-attention-backend flashinfer
      --decode-attention-backend flashinfer
      --trust-remote-code
      --log-level info
      --max-running-requests 256
      --max-queued-requests 512
      --context-length 131072
      --chunked-prefill-size 4096
      --max-prefill-tokens 8192
      --max-total-tokens 32768
      --prefill-max-requests 32
      --enable-dynamic-chunking
      --enable-mixed-chunk
      --enable-single-batch-overlap
      --schedule-policy lpm
      --schedule-conservativeness 0.9
      --page-size 64
      --enable-torch-compile
      --torch-compile-max-bs 256
      --cuda-graph-max-bs 512
      --warmups 5
      --enable-metrics
      --enable-metrics-for-all-schedulers
      --radix-eviction-policy lru

  neo4j:
    image: docker.io/library/neo4j:latest
    container_name: neo4j
    restart: always
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-password}
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
    ports:
      - "${NEO4J_BROWSER_PORT}:${NEO4J_BROWSER_PORT}"
      - "${NEO4J_BOLT_PORT}:${NEO4J_BOLT_PORT}"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-password}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    container_name: embedding
    profiles: ["embedding"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - HF_HUB_ENABLE_HF_TRANSFER=1
      - HUGGINGFACE_HUB_CACHE=/data
    ports:
      - "30003:80"
    volumes:
      - hf-cache:/data
      - ./logs/embedding:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 300s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    command:
      - --model-id
      - mixedbread-ai/mxbai-embed-large-v1
      - --hostname
      - 0.0.0.0
      - --port
      - "80"
      - --max-concurrent-requests
      - "256"
      - --max-batch-tokens
      - "4096"
      - --max-client-batch-size
      - "32"

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=sqlite:///mlflow/mlflow.db
      - MLFLOW_ARTIFACT_ROOT=/mlflow/artifacts
    volumes:
      - ./.mlflow:/mlflow
      - ./.mlflow/mlflow_artifacts:/mlflow/artifacts
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --workers 4
      --uvicorn-opts "--timeout-keep-alive 120 --limit-max-requests 1000"
    restart: unless-stopped
volumes:
  hf-cache:
    name: sglang-hf-cache
  neo4j_data:
    name: neo4j_data
  neo4j_logs:
    name: neo4j_logs
  neo4j_import:
    name: neo4j_import
