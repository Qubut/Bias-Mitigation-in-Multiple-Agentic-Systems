db_url: sqlite+aiosqlite:///./datasets.db
num_agents: 2
rounds: 4
protocol: cooperative
malicious: false
# Evaluator runs through dspy.Evaluate. max_evaluation_threads → num_threads;
# the LLM-level knobs apply to each agent's bounded-concurrency LM client.
evaluator_max_errors: 50
evaluator_disable_progress_bar: false
evaluator_concurrency:
  max_evaluation_threads: 8
  max_llm_inflight_per_endpoint: 8
  llm_timeout_seconds: 20.0
  llm_retry_attempts: 3
  llm_retry_backoff_min_seconds: 0.5
  llm_retry_backoff_max_seconds: 2.0
memory_orchestration:
  worker_threads: 12
  max_pending_store_tasks: 128
  # Embedding round-trip alone is ~1.7s under load (see docker embedding
  # service logs), and mem0's store path additionally writes to the vector
  # store and (with infer=True) calls an LLM to extract memorables.
  # These give the backend headroom while
  # still capping pathological latency.
  recall_timeout_ms: 8000
  store_timeout_ms: 6000
  store_async: true
  failure_trip_threshold: 8
  recovery_success_threshold: 6
gepa:
  # Budget profile.  'light' ≈ ~6× trainset metric calls.  Set to null and use
  # max_full_evals / max_metric_calls for explicit budget control.
  auto: null
  max_full_evals: null
  max_metric_calls: 970
  num_threads: 8
  track_stats: true
  use_merge: false
  seed: 42
  failure_score: 0.0
  # Optional separate (stronger) reflection LM.  Same model-name format as
  # agent_models entries (e.g. "openai/meta-llama/Llama-3.1-8B-Instruct").
  reflection_lm_model: openai/deepseek-ai/DeepSeek-R1-Distill-Llama-8B
  # Reflection-LM tuning knobs.  Proposers benefit from diversity (non-zero
  # temperature) rather than the agents' task-time setting.  Fallback tokens
  # and retries only matter when reflection_lm_model is *not* mirrored from
  # one of agent_models[*].name (e.g. for hosted models via LiteLLM env vars).
  reflection_temperature: 1.0
  reflection_fallback_max_tokens: 4096
  reflection_num_retries: 3
  # Where to save the optimized DSPy program (program.save() format).
  save_path: evaluation/checkpoints/gepa_optimized.json
  # Stratified dev examples used by GEPA *during* optimization (Pareto tracker).
  # 0 disables → GEPA falls back to trainset (overfits, emits a warning).
  valset_size: 200
  # Stratified dev examples used for *post-GEPA* hold-out validation (0 disables).
  validation_subset: 500
analysis_artifact_root: evaluation/analysis/v1
analysis_local_root: evaluation/analysis/live
stream_flush_every_events: 1
stream_fsync: false
stream_live_csv: true
stream_max_buffered_events: 2048
stream_drop_events_on_backpressure: false
analysis_live_dir_template: "{started_at}_{run_name}_{intervention}_{run_id_short}"
analysis_live_slug_max_length: 48
analysis_live_write_manifest: true
analysis_live_index_filename: runs_index.jsonl
reset_memory_on_genesis: false
intervention: mem0g
memory_config:
  enable_dimension_fallback: true
  embedder_force_dimensionless_requests: true
  recall_top_k: 3
  max_query_chars: 2048
  max_memory_content_chars: 4096
  max_passage_chars: 1200
  max_recalled_chars: 4000
  enable_resilient_search_fallback: true
  search_fallback_limit: 1
  search_fallback_retry_attempts: 1
  search_fallback_consecutive_fail_trip_threshold: 4
  search_fallback_cooldown_ms: 20000
  search_fallback_warning_every: 25
  memory_add_infer: false
  memory_pressure_mode: normal
  memory_operation_semaphore_limit: 8
  # Slot acquisition timeout must stay strictly below the orchestrator's
  # recall/store budgets so a slow backend surfaces as a recall/store
  # timeout (informative) rather than as a slot saturation (pressure trip).
  memory_slot_timeout_ms: 4000
  pressure_timeout_trip_threshold: 12
  pressure_cooldown_ms: 12000
  drop_store_on_backpressure: true
  degrade_search_on_backpressure: true
  pressure_warning_every: 25
  store_retry_attempts: 3
  search_retry_attempts: 3
  retry_backoff_min_ms: 50
  retry_backoff_max_ms: 1500
  retry_jitter_ms: 120
  transient_error_markers:
    - cannot commit - no transaction is active
    - database is locked
    - transaction
    - busy
    - timeout
    - timed out
    - deadline exceeded
    - connection reset
    - connection refused
    - temporarily unavailable
    - service unavailable
    - too many requests
    - "429"
    - "502"
    - "503"
    - "504"
  render_recalled_memory_style: bullet
  recall_max_items: 5
  include_question_in_memory_text: true
  llm:
    provider: openai
    config:
      model: "meta-llama/Llama-3.1-8B-Instruct"
      temperature: 0.0
      max_tokens: 8192
      top_p: 0.95
      openai_base_url: http://localhost:30002/v1
      api_key: local
  embedder:
    provider: openai
    config:
      model: mixedbread-ai/mxbai-embed-large-v1
      openai_base_url: http://localhost:30003/v1
      api_key: local
  vector_store:
    provider: chroma
    config:
      path: ./.chroma_memories
      collection_name: bias_mitigation_v2
  # graph_store:
    # provider: neo4j
    # config:
    #   url: bolt://localhost:7687
    #   username: ${oc.env:NEO4J_USERNAME,neo4j}
    #   password: ${oc.env:NEO4J_PASSWORD,password}

agent_models:
  - name: "openai/meta-llama/Llama-3.1-8B-Instruct"
    api_key: ${oc.env:OPENAI_API_KEY,local}
    api_base: http://localhost:30001/v1
    temperature: 0.0
    max_tokens: 10240
    agent_name: "Agent_Llama-3.1-8B-Instruct"

  - name: "openai/meta-llama/Llama-3.1-8B-Instruct"
    api_key: ${oc.env:OPENAI_API_KEY,local}
    api_base: http://localhost:30001/v1
    temperature: 0.0
    max_tokens: 10240
    agent_name: "Agent_Llama-3.1-8B-Instruct"
