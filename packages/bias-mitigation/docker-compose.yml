services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: always
    devices:
      - "nvidia.com/gpu=all"
    ports:
      - "${OLLAMA_PORT}:${OLLAMA_PORT}"
    volumes:
      - ./.ollama:/root/.ollama

  mongodb:
    image: docker.io/library/mongo:latest
    container_name: mongodb
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    ports:
      - "${MONGO_PORT}:${MONGO_PORT}"
    volumes:
      - mongodb_data:/data/db

  neo4j:
    image: docker.io/library/neo4j:latest
    container_name: neo4j
    restart: always
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
    ports:
      - "${NEO4J_BROWSER_PORT}:${NEO4J_BROWSER_PORT}"
      - "${NEO4J_BOLT_PORT}:${NEO4J_BOLT_PORT}"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  sglang-qwen:
    image: lmsysorg/sglang:latest
    container_name: sglang-qwen
    profiles: ["qwen"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']          # Pin to GPU 0
              capabilities: [gpu]
    ports:
      - "30001:30000"
    ipc: host
    shm_size: '32g'
    cap_add:
      - IPC_LOCK
    ulimits:
      memlock: -1
      stack: 67108864
    volumes:
      - ./.huggingface/:/root/.cache/huggingface
      - ./logs:/app/logs
    # NO custom entrypoint — use official command
    command: >
      python3 -m sglang.launch_server
      --model-path ${SGLANG_QWEN_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      --host 0.0.0.0
      --port 30000
      --tp-size 1
      --mem-fraction-static 0.75
      --kv-cache-dtype fp8_e4m3
      --attention-backend flashinfer
      --trust-remote-code
      --log-level info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:30000/v1/models"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  sglang-llama:
    image: lmsysorg/sglang:latest
    container_name: sglang-llama
    profiles: ["llama"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']          # Pin to GPU 1
              capabilities: [gpu]
    ports:
      - "30002:30000"
    ipc: host
    shm_size: '32g'
    cap_add:
      - IPC_LOCK
    ulimits:
      memlock: -1
      stack: 67108864
    volumes:
      - ./.huggingface:/root/.cache/huggingface
      - ./logs:/app/logs
    command: >
      python3 -m sglang.launch_server
      --model-path ${SGLANG_LLAMA_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
      --host 0.0.0.0
      --port 30000
      --tp-size 1
      --mem-fraction-static 0.75
      --kv-cache-dtype fp8_e4m3
      --attention-backend flashinfer
      --trust-remote-code
      --log-level info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:30000/v1/models"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  sglang-large:                     # 2 GPUs – for 70B model
    image: lmsysorg/sglang:latest
    container_name: sglang-large
    profiles: ["large"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2
              capabilities: [gpu]
    ports:
      - "30002:30000"               # dedicated port for large model
    ipc: host
    shm_size: '64g'
    cap_add:
      - IPC_LOCK
    ulimits:
      memlock: -1
      stack: 67108864
    volumes:
      - ./models:/root/.cache/huggingface
      - ./logs:/app/logs
    entrypoint: ["/app/docker-entrypoint.sh"]
    environment:
      - MODEL_PATH=${SGLANG_LARGE_MODEL:-hugging-quants/Meta-Llama-3.1-70B-Instruct-AWQ-INT4}
      - QUANTIZATION=${SGLANG_LARGE_QUANT:-compressed-tensors}
      - TP_SIZE=2
      - MEM_FRACTION_STATIC=0.80
      - KV_CACHE_DTYPE=fp8_e4m3
      - CHUNKED_PREFILL_SIZE=512
      - ATTENTION_BACKEND=flashinfer
      - TRUST_REMOTE_CODE=true
      - HOST=0.0.0.0
      - PORT=30000
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - LOG_LEVEL=info
    command: >
        python3 -m sglang.launch_server
        --model-path ${MODEL_PATH}
        --quantization ${QUANTIZATION}
        --tp-size ${TP_SIZE}
        --mem-fraction-static ${MEM_FRACTION_STATIC}
        --kv-cache-dtype ${KV_CACHE_DTYPE}
        --chunked-prefill-size ${CHUNKED_PREFILL_SIZE}
        --attention-backend ${ATTENTION_BACKEND}
        --trust-remote-code
        --host ${HOST}
        --port ${PORT}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:30000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s   # 70B needs longer warmu
    # Useful for debugging / seeing GPU usage
    stdin_open: true
    tty: true

volumes:
  mongodb_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
